# Staging: PR vào develop chỉ build (kiểm); merge vào develop → build dist/ → rsync lên VPS (/opt/commerio/site), Caddy phục vụ cùng origin với API (V38).
# VPS không build gì. Tài khoản fe-deploy trên VPS chỉ rsync được vào thư mục đó (rrsync -wo), không có shell.
# Biến repo: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SITE_ADDRESS (tên miền, như backend), STAGING_GOOGLE_CLIENT_ID (tuỳ chọn).
# Secret repo: STAGING_SSH_KEY (khoá riêng ed25519), STAGING_SSH_KNOWN_HOSTS (dòng ssh-keyscan của VPS).
name: Deploy staging

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# Mỗi lúc một lần deploy; lần mới chờ lần đang chạy xong. PR có nhóm riêng, đẩy commit mới thì huỷ lần cũ.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-staging' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bản build gọi backend thật qua /api cùng origin, không bật MSW.
      - run: pnpm build
        env:
          VITE_USE_MOCKS: 'false'
          VITE_API_BASE_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  # Không chạy trên PR. Chưa có VPS: biến STAGING_SSH_HOST trống nên job bị bỏ qua (không đỏ).
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.STAGING_SSH_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SITE_ADDRESS: ${{ vars.STAGING_SITE_ADDRESS }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Khoá SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      # rrsync neo đường dẫn ở /opt/commerio/site nên đích là "/". --delay-updates thay file gần như cùng lúc ở cuối.
      # Không đưa sourcemap lên staging.
      - name: Chép dist/ lên VPS
        run: |
          rsync -rlz --delete-delay --delay-updates --exclude='*.map' --chmod=D755,F644 \
            dist/ "$SSH_USER@$HOST:/"
      - name: Kiểm trang chủ
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$SITE_ADDRESS/")
          echo "GET / → $code"
          [ "$code" = 200 ]
