# Kiểm mỗi PR và mỗi lần đẩy lên main (FE#69; Documents/26-ke-hoach-kiem-thu.md §2.1):
#   check: lint (ESLint 9), typecheck, unit test (Vitest)
#   e2e:   Playwright trên mock MSW (Vite dev, mock bật), project `mock` (e2e/mock), chạy song song
# Chưa chạy `pnpm e2e:be` (BE thật, DB commerio_e2e): cần checkout commerio-backend và PostgreSQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Đẩy commit mới lên PR thì huỷ lần chạy cũ của PR đó.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trình duyệt phải khớp đúng phiên bản @playwright/test (ghim trong package.json): cache theo phiên bản đó.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Playwright tự bật Vite (playwright.config.ts, webServer) và tắt khi xong.
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
