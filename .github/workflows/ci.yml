# Kiểm mỗi PR và mỗi lần đẩy lên main (FE#69; Documents/26-ke-hoach-kiem-thu.md §2.1):
#   check: lint (ESLint 9), typecheck, unit test (Vitest)
#   e2e:   Cypress trên mock MSW (Vite dev, mock bật mặc định), mọi spec ngoài nhóm cypress/e2e/*-be
# Chưa chạy `pnpm e2e:be` (BE thật, DB commerio_e2e): cần checkout commerio-backend và PostgreSQL, làm ở bước sau của FE#69.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Đẩy commit mới lên PR thì huỷ lần chạy cũ của PR đó.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # Job này không chạy Cypress: bỏ tải binary (~500 MB).
          CYPRESS_INSTALL_BINARY: 0
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vite nghe 127.0.0.1: để `localhost` thì Vite có thể chỉ nghe ::1, Cypress gọi 127.0.0.1 bị ECONNREFUSED.
      - uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          start: pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort
          wait-on: http://127.0.0.1:5173
          wait-on-timeout: 120
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
          VITE_USE_MOCKS: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
