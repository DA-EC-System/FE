# E2E Playwright với BE thật: job `e2e-be` chạy `pnpm e2e:be` trên staging (https://116-118-6-7.sslip.io), project `be`
# (e2e/be). FE không còn mock (Thành chốt 20/11/2026): bộ e2e/mock và MSW đã gỡ. Tách khỏi CI vì chạy lâu.
#   Staging chạy code của main (merge vào main là deploy), nên chỉ chạy trên main, không chạy trên PR.
#   Mỗi file spec tự đăng ký công ty giả mới qua API công khai (e2e/be/congTyGia.ts), không ghi DB; cuối lượt xoá hết
#   (e2e/be/soCongTyThu.ts). Test cần đơn sàn, gian hàng, bảng kê để test.fixme (ghi lý do trong spec); be/p3 bỏ qua vì
#   không đặt E2E_SAN_BE207 (spec đó ngắt thật gian hàng Lazada).
#   Staging giới hạn 20 lần gọi /identity/login và /identity/register mỗi 15 phút mỗi IP: một lần chạy gọi /login 18 lần,
#   /register 9 lần (mỗi test p1 đỏ thêm một lần: Playwright mở worker mới, chạy lại beforeAll; be/p2 phiếu kho, trả NCC thêm
#   một login, một register). Đã sát trần: thêm spec mới thì gộp vào file có sẵn, không thêm lần đăng nhập.
# Khi nào chạy: mỗi đêm 02:00 giờ Việt Nam trên main, hoặc bấm "Run workflow" trên main.
# Đỏ thì job `notify` comment vào mọi PR đã merge từ lần xanh gần nhất trên main, mỗi PR một lần cho mỗi chuỗi đỏ
# (dấu <!-- e2e-be-base:<sha> -->, chống comment lặp các đêm sau). Có thể đỏ do backend đổi: comment ghi rõ, không tag được
# tác giả PR backend.
name: E2E

on:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 02:00 giờ Việt Nam
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-be:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Dùng chung DB staging: hai lần chạy không bao giờ chồng nhau, lần sau xếp hàng chờ.
    concurrency:
      group: e2e-be-staging
      cancel-in-progress: false
    outputs:
      staging_up: ${{ steps.staging.outputs.up }}
    env:
      PW_BASE_URL: https://116-118-6-7.sslip.io
      # Để trống có chủ đích: be/p3 chỉ chạy khi bằng 1, và spec đó ngắt thật gian hàng Lazada dùng chung.
      E2E_SAN_BE207: ''
      # Mã thử đăng ký (commerio-backend#459, e2e/be/dangKy.ts): cùng giá trị với REGISTRATION_TEST_EMAIL_DOMAIN,
      # REGISTRATION_TEST_CODE của BE staging.
      E2E_REGISTRATION_TEST_EMAIL_DOMAIN: ${{ secrets.E2E_REGISTRATION_TEST_EMAIL_DOMAIN }}
      E2E_REGISTRATION_TEST_CODE: ${{ secrets.E2E_REGISTRATION_TEST_CODE }}
      # Không ghi trace, ảnh chụp (chứa mã thử); job cũng không tải báo cáo lên artifact (repo public)
      PW_NO_TRACE: '1'
    steps:
      # Staging không trả lời thì dừng sớm, notify không tag tác giả PR (lỗi môi trường, không phải do PR).
      - id: staging
        name: Kiểm staging còn chạy
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-all-errors "$PW_BASE_URL/api/v1/identity/roles" || true)
          if [ "$code" = "401" ]; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "Staging $PW_BASE_URL không trả lời đúng (GET /api/v1/identity/roles trả $code, mong 401)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Có PW_BASE_URL nên Playwright không bật Vite, mở thẳng staging.
      # Không tải báo cáo lên artifact: repo public, báo cáo (error-context, bước fill) chứa mã thử đăng ký
      # (commerio-backend#459). Log của job thì GitHub tự che giá trị secret; xem lỗi trong log.
      - run: pnpm e2e:be
      # Lưới cuối khi Playwright bị huỷ, hết giờ trước teardown `be-don`: xoá công ty thử còn trong sổ (Documents/21
      # mục 2.2, không có việc nền dọn định kỳ). Sổ rỗng thì không gọi gì.
      - name: Dọn công ty thử còn sót
        if: always()
        run: node e2e/be/soCongTyThu.ts

  notify:
    needs: [e2e-be]
    if: always() && needs.e2e-be.result == 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: be
            job: e2e-be
            result: ${{ needs.e2e-be.result }}
            cmd: '`pnpm e2e:be` trên staging'
            artifact: ''
            report_hint: Xem lỗi trong log của job e2e-be (không tải báo cáo lên vì repo public, báo cáo chứa mã thử đăng ký).
            marker: e2e-be-base
            staging_up: ${{ needs.e2e-be.outputs.staging_up }}
    name: notify (${{ matrix.suite }})
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUITE_JOB: ${{ matrix.job }}
      SUITE_CMD: ${{ matrix.cmd }}
      ARTIFACT: ${{ matrix.artifact }}
      REPORT_HINT: ${{ matrix.report_hint }}
      MARKER: ${{ matrix.marker }}
    steps:
      - name: Bộ này xanh hoặc không chạy
        if: matrix.result != 'failure'
        run: |
          echo "Bộ ${{ matrix.suite }}: ${{ matrix.result }}, không báo."

      - name: Staging không trả lời
        if: matrix.result == 'failure' && matrix.staging_up == 'false'
        run: |
          echo "E2E ${SUITE_CMD} đỏ vì staging không trả lời, không tag ai: ${RUN_URL}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: matrix.result == 'failure' && matrix.staging_up != 'false'
        with:
          fetch-depth: 0

      - name: Comment vào các PR đã merge từ lần xanh gần nhất của bộ này
        if: matrix.result == 'failure' && matrix.staging_up != 'false'
        run: |
          head="$GITHUB_SHA"
          # Lần xanh gần nhất của job này trên main.
          base=""
          for id in $(gh run list -R "$REPO" --workflow e2e.yml --branch main --limit 50 \
              --json databaseId,event --jq '.[] | select(.event != "pull_request") | .databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"$SUITE_JOB\" and .conclusion == \"success\")] | length")
            if [ "$ok" != "0" ]; then
              base=$(gh api "repos/$REPO/actions/runs/$id" --jq '.head_sha'); break
            fi
          done
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Chưa có lần xanh nào của bộ này trên main: không có mốc để biết PR nào làm đỏ, không tag ai
            # (đoán theo khoảng thời gian từng tag nhầm 15 PR cũ, run 42187649380).
            echo "Chưa có lần ${SUITE_CMD} xanh nào trên main nên không biết PR nào làm đỏ, không tag ai: ${RUN_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          note=""
          if [ "$SUITE_JOB" = "e2e-be" ]; then
            note="Bộ này chạy trên staging nên cũng có thể đỏ vì backend (commerio-backend) vừa đổi; workflow không tag được tác giả PR backend."
          fi
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            echo "Không có commit FE mới kể từ lần xanh gần nhất của ${SUITE_CMD}: lỗi môi trường, test chập chờn hoặc backend đổi, không tag ai. ${note}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          prs=$(git rev-list "$base..$head" | while read -r c; do
            gh api "repos/$REPO/commits/$c/pulls" --jq '.[] | select(.merged_at != null) | "\(.number) \(.user.login)"'
          done | sort -un)
          if [ -z "$prs" ]; then
            echo "Không tìm thấy PR nào trong ${base:0:7}..${head:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          list=$(echo "$prs" | awk '{printf "#%s ", $1}')
          marker="<!-- ${MARKER}:${base} -->"

          echo "$prs" | while read -r pr author; do
            if gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
              echo "#$pr đã được báo trong chuỗi đỏ này"; continue
            fi
            gh pr comment "$pr" -R "$REPO" --body "$marker
          @${author} E2E ${SUITE_CMD} chạy trên \`main\` (\`${head:0:7}\`) đỏ: ${RUN_URL}
          PR này nằm trong các PR đã merge từ lần xanh gần nhất của bộ này (\`${base:0:7}\`): ${list}
          ${note}
          ${REPORT_HINT} Lỗi do PR này thì mở PR sửa; không phải thì trả lời ở đây để nhóm biết."
            echo "Đã báo #$pr (@$author)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
